<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FAX送付状作成 - あさぎ訪問看護リハビリステーション</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: "Hiragino Kaku Gothic ProN", "ヒラギノ角ゴ ProN", "Meiryo", "Yu Gothic", sans-serif;
    background: #eef2f7;
    color: #2c3e50;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-columns: 400px 1fr;
    min-height: 100vh;
  }
  @media (max-width: 1100px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { max-height: none !important; }
  }

  /* ===== Sidebar ===== */
  .sidebar {
    background: #ffffff;
    border-right: 1px solid #dde6ee;
    padding: 24px 20px;
    overflow-y: auto;
    max-height: 100vh;
  }
  .app-title {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #0a6ebd;
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .app-title .icon {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, #0a6ebd, #4ba3d6);
    color: white;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }
  .app-subtitle {
    color: #7b8a9a;
    font-size: 11px;
    margin-bottom: 18px;
  }

  .section {
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #eef2f7;
  }
  .section:last-child { border-bottom: none; }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: #0a6ebd;
    margin-bottom: 10px;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .section-title::before {
    content: '';
    display: inline-block;
    width: 3px; height: 14px;
    background: #0a6ebd;
    border-radius: 2px;
  }

  .field { margin-bottom: 12px; }
  .field label {
    display: block;
    font-size: 11px;
    color: #5a6878;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .field input, .field textarea, .field select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #d1dbe5;
    border-radius: 6px;
    font-size: 13px;
    font-family: inherit;
    color: #2c3e50;
    background: #fff;
    transition: 0.15s;
  }
  .field input:focus, .field textarea:focus, .field select:focus {
    outline: none;
    border-color: #0a6ebd;
    box-shadow: 0 0 0 3px rgba(10, 110, 189, 0.1);
  }
  .field textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  #f-body { min-height: 260px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .contact-row { display: grid; grid-template-columns: 1fr 116px 34px; gap: 6px; margin-bottom: 6px; align-items: center; }
  .contact-row .contact-remove { padding: 7px 0; font-size: 12px; background: transparent; color: #c5221f; border: 1px solid #f4cdcb; border-radius: 6px; cursor: pointer; }
  .contact-row .contact-remove:hover { background: #fce8e6; }

  /* Buttons */
  button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    transition: 0.15s;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  .btn-primary { background: #0a6ebd; color: white; }
  .btn-primary:hover { background: #085a9c; }
  .btn-secondary { background: #e7f1f9; color: #0a6ebd; }
  .btn-secondary:hover { background: #d2e6f5; }
  .btn-success { background: #2ea44f; color: white; }
  .btn-success:hover { background: #258940; }
  .btn-ghost { background: transparent; color: #5a6878; border: 1px solid #d1dbe5; }
  .btn-ghost:hover { background: #f5f7fa; }
  .btn-danger { background: transparent; color: #c5221f; border: 1px solid #f4cdcb; }
  .btn-danger:hover { background: #fce8e6; }
  .btn-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }

  .saved-list {
    max-height: 220px;
    overflow-y: auto;
    border: 1px solid #eef2f7;
    border-radius: 6px;
    background: #fafbfd;
  }
  .saved-list:empty::after {
    content: '保存されたデータはありません';
    display: block;
    padding: 16px;
    text-align: center;
    color: #a4b0bc;
    font-size: 12px;
  }
  .saved-item {
    padding: 10px 12px;
    border-bottom: 1px solid #eef2f7;
    transition: 0.15s;
  }
  .saved-item:last-child { border-bottom: none; }
  .saved-item:hover { background: #fff; }
  .saved-item-title {
    font-size: 13px;
    font-weight: 600;
    color: #2c3e50;
    margin-bottom: 2px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .saved-item-meta {
    font-size: 10px;
    color: #8b9aab;
    margin-bottom: 6px;
  }
  .saved-item-actions {
    display: flex;
    gap: 6px;
  }

  /* ===== Preview Area ===== */
  .preview-area {
    padding: 24px;
    overflow-y: auto;
    overscroll-behavior: contain;
    max-height: 100vh;
    background: #eef2f7;
    contain: layout;
  }
  .toolbar {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    flex-wrap: wrap;
  }
  .toolbar .spacer { flex: 1; }
  .toolbar button { padding: 10px 18px; font-size: 14px; }
  .pages-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    padding-bottom: 40px;
  }

  /* ===== A4 Page (FAXは白黒送信のためモノクロ設計) ===== */
  .page {
    width: 210mm;
    height: 297mm;
    background: white;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
    padding: 12mm 16mm 12mm 16mm;
    position: relative;
    overflow: hidden;
    color: #000;
    contain: layout;
  }

  .doc-header {
    text-align: center;
    padding-bottom: 1mm;
    margin-bottom: 2mm;
    border-bottom: 3px double #000;
  }
  .doc-title {
    font-size: 18pt;
    font-weight: 900;
    color: #000;
    letter-spacing: 0.5em;
    padding-left: 0.5em;
  }
  .doc-subtitle {
    font-size: 9pt;
    color: #000;
    letter-spacing: 0.3em;
    margin-top: 2mm;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 3mm;
    font-size: 10.5pt;
    color: #000;
  }
  .date-display {
    color: #000;
    font-weight: 600;
  }
  .pages-display {
    border: 1.5px solid #000;
    color: #000;
    padding: 1.2mm 4mm;
    font-weight: 700;
    font-size: 10pt;
  }

  .recipient-block {
    margin-bottom: 3mm;
    padding-bottom: 2mm;
    border-bottom: 1px solid #000;
  }
  .recipient-name {
    font-size: 14pt;
    font-weight: 700;
    color: #000;
    margin-bottom: 1mm;
  }
  .recipient-person {
    font-size: 13pt;
    color: #000;
    padding-left: 2mm;
  }

  .sender-block {
    margin-bottom: 3mm;
    padding: 2.5mm 4mm;
    border: 1.5px solid #000;
    border-left: 5px solid #000;
  }
  .sender-label {
    font-size: 8.5pt;
    color: #000;
    font-weight: 700;
    margin-bottom: 1.5mm;
    letter-spacing: 0.15em;
    border-bottom: 1px dotted #000;
    padding-bottom: 1mm;
    display: inline-block;
  }
  .sender-name {
    font-size: 12pt;
    font-weight: 700;
    color: #000;
    margin: 1mm 0;
  }
  .sender-contact {
    font-size: 10.5pt;
    color: #000;
    display: flex;
    gap: 8mm;
  }
  .sender-contact span strong {
    color: #000;
    font-weight: 700;
    border: 1px solid #000;
    padding: 0.3mm 1.5mm;
    font-size: 8.5pt;
    display: inline-block;
    vertical-align: middle;
    margin-right: 2mm;
  }
  .sender-person {
    margin-top: 2.5mm;
    padding-top: 2mm;
    border-top: 1px dotted #000;
    font-size: 11pt;
    color: #000;
    font-weight: 600;
  }
  .sender-person::before {
    content: '担当： ';
    font-size: 9pt;
    font-weight: 700;
    margin-right: 1mm;
  }

  .title-block {
    margin: 3mm 0 3mm;
    padding: 2.5mm 4mm;
    border-top: 2px solid #000;
    border-bottom: 2px solid #000;
    text-align: center;
  }
  .title-label {
    font-size: 9pt;
    color: #000;
    letter-spacing: 0.5em;
    margin-bottom: 1.5mm;
    font-weight: 700;
  }
  .title-text {
    font-size: 13pt;
    font-weight: 700;
    color: #000;
  }

  .body-section-label {
    font-size: 10pt;
    color: #000;
    font-weight: 700;
    letter-spacing: 0.3em;
    margin-bottom: 2mm;
    padding: 1mm 4mm 1.5mm 4mm;
    border-left: 5px solid #000;
    border-bottom: 2px solid #000;
    display: inline-block;
  }
  .body-block {
    font-size: 11pt;
    line-height: 1.9;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: #000;
    margin-top: 1mm;
  }

  .page-footer {
    position: absolute;
    bottom: 8mm;
    left: 16mm;
    right: 16mm;
    padding-top: 3mm;
    border-top: 1px solid #000;
    display: flex;
    justify-content: space-between;
    font-size: 8.5pt;
    color: #000;
  }

  .page-2 .body-section-label { margin-top: 0; }

  /* Print */
  @media print {
    body, html { background: white; }
    .app { display: block; }
    .sidebar, .toolbar { display: none !important; }
    .preview-area { padding: 0; max-height: none; overflow: visible; background: white; }
    .pages-container { gap: 0; padding: 0; }
    .page {
      width: 210mm;
      height: 297mm;
      box-shadow: none;
      margin: 0;
      page-break-after: always;
    }
    .page:last-child { page-break-after: auto; }
    @page { size: A4; margin: 0; }
  }

  /* Mobile sidebar toggle for preview */
  .mobile-toggle { display: none; }
  @media (max-width: 1100px) {
    .mobile-toggle {
      display: inline-block;
      margin-bottom: 12px;
    }
    /* iPad/スマホ: プレビューの独自スクロールをやめページ全体でスクロール（最下部まで到達可能に） */
    .preview-area { max-height: none; overflow: visible; contain: none; padding: 12px; }
    .pages-container { padding-bottom: 80px; }
    #mobileEditBtn { display: inline-block !important; }
  }
  /* iOS Safariのアドレスバー分を考慮した高さ */
  @supports (height: 100dvh) {
    .sidebar, .preview-area { max-height: 100dvh; }
    .app { min-height: 100dvh; }
  }

  .empty-hint {
    color: #b8c2cc;
    font-style: italic;
  }
</style>
</head>
<body>
<div class="app">

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="app-title">
      <span class="icon">📠</span>
      <span>FAX送付状作成</span>
    </div>
    <div class="app-subtitle">あさぎ訪問看護リハビリステーション</div>

    <!-- 入力 -->
    <div class="section">
      <div class="section-title">基本情報</div>
      <div class="field">
        <label>日付</label>
        <input type="date" id="f-date">
      </div>
      <div class="field">
        <label>宛先（事業所名・敬称）</label>
        <input type="text" id="f-recipient" placeholder="例) ○○病院 御中">
      </div>
      <div class="field">
        <label>担当者（＋で複数追加可）</label>
        <div id="contacts-container"></div>
        <button type="button" class="btn-secondary btn-sm" onclick="addContact()" style="margin-top:6px;width:100%;">＋ 担当者を追加</button>
      </div>
      <div class="field">
        <label>送付枚数（この用紙を含む）</label>
        <input type="number" id="f-pages" min="1" max="99" value="1">
      </div>
      <div class="field">
        <label>送信者名（自分の名前 / 一度入力すると次回から自動入力）</label>
        <input type="text" id="f-sender" placeholder="例) 浅木 太郎">
      </div>
    </div>

    <div class="section">
      <div class="section-title">本文</div>
      <div class="field">
        <label>表題</label>
        <input type="text" id="f-title" placeholder="例) ご報告の件">
      </div>
      <div class="field">
        <label>本文</label>
        <textarea id="f-body" placeholder="お世話になっております。&#10;あさぎ訪問看護リハビリステーションです。&#10;..."></textarea>
      </div>
      <div class="field">
        <label>本文フォントサイズ</label>
        <select id="f-fontsize">
          <option value="9">小（9pt）</option>
          <option value="10">やや小（10pt）</option>
          <option value="11" selected>標準（11pt）</option>
          <option value="13">やや大（13pt）</option>
          <option value="15">大（15pt）</option>
        </select>
      </div>
      <div class="btn-row">
        <button class="btn-secondary btn-sm" onclick="openTemplateSaveDialog()">＋ テンプレートに保存</button>
        <button class="btn-ghost btn-sm" onclick="clearForm()">クリア</button>
      </div>
    </div>

    <!-- テンプレート -->
    <div class="section">
      <div class="section-title">テンプレート</div>
      <div class="saved-list" id="templates-list"></div>
    </div>

    <!-- 履歴 -->
    <div class="section">
      <div class="section-title">履歴</div>
      <div class="btn-row" style="margin-bottom: 8px;">
        <button class="btn-success btn-sm" onclick="saveToHistory()">📝 現在の内容を履歴に保存</button>
      </div>
      <div class="saved-list" id="history-list"></div>
    </div>

  </aside>

  <!-- ===== PREVIEW ===== -->
  <main class="preview-area">
    <div class="toolbar">
      <strong style="color:#0a6ebd;">プレビュー</strong>
      <span class="spacer"></span>
      <button class="btn-ghost" onclick="document.querySelector('.sidebar').scrollIntoView({behavior:'smooth'})" id="mobileEditBtn" style="display:none;">✏️ 編集</button>
      <button class="btn-secondary" onclick="printDoc()">🖨 印刷</button>
      <button class="btn-primary" onclick="downloadPDF()" id="pdfBtn">⬇ PDFダウンロード</button>
    </div>

    <div class="pages-container" id="pagesContainer">
      <!-- Page 1 -->
      <div class="page page-1" id="page1">
        <div class="doc-header">
          <div class="doc-title">FAX送付状</div>
        </div>

        <div class="top-row">
          <div class="date-display" id="p-date">2026年5月1日</div>
          <div class="pages-display" id="p-pages">送付枚数： 1 枚（本紙含む）</div>
        </div>

        <div class="recipient-block">
          <div class="recipient-name" id="p-recipient"><span class="empty-hint">宛先を入力してください</span></div>
          <div class="recipient-person" id="p-person"></div>
        </div>

        <div class="sender-block">
          <div class="sender-label">差出人 / FROM</div>
          <div class="sender-name">あさぎ訪問看護リハビリステーション</div>
          <div class="sender-contact">
            <span><strong>TEL</strong>042-851-6691</span>
            <span><strong>FAX</strong>042-851-6695</span>
          </div>
          <div class="sender-person" id="p-sender" style="display:none;"></div>
        </div>

        <div class="title-block">
          <div class="title-label">件 名</div>
          <div class="title-text" id="p-title"><span class="empty-hint">表題を入力してください</span></div>
        </div>

        <div class="body-section-label">本　文</div>
        <div class="body-block" id="p-body"></div>

        <div class="page-footer">
          <span>あさぎ訪問看護リハビリステーション</span>
          <span id="p-footer-1">1 / 1</span>
        </div>
      </div>

      <!-- 2枚目以降は本文量に応じてJSで自動生成 -->
    </div>

  </main>
</div>

<!-- ===== Template Save Dialog ===== -->
<div id="dialog-overlay" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); z-index:100; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:10px; padding:24px; min-width:320px; max-width:400px; box-shadow:0 8px 24px rgba(0,0,0,0.2);">
    <h3 style="color:#0a6ebd; margin-bottom:12px;">テンプレートを保存</h3>
    <div class="field">
      <label>テンプレート名</label>
      <input type="text" id="dialog-input" placeholder="例) ご報告テンプレート">
    </div>
    <div class="btn-row" style="justify-content:flex-end; margin-top:16px;">
      <button class="btn-ghost" onclick="closeDialog()">キャンセル</button>
      <button class="btn-primary" onclick="confirmTemplateSave()">保存</button>
    </div>
  </div>
</div>

<script>
/* =====================================
 * State
 * ===================================== */
const STORAGE_KEYS = {
  current: 'asagi_fax_current_v1',
  templates: 'asagi_fax_templates_v1',
  history: 'asagi_fax_history_v1',
  defaultSender: 'asagi_fax_default_sender_v1'
};

const SENDER = {
  name: 'あさぎ訪問看護リハビリステーション',
  tel: '042-851-6691',
  fax: '042-851-6695'
};

let templates = [];
let history = [];

/* =====================================
 * Utilities
 * ===================================== */
function todayISO() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}
function formatDate(iso) {
  if (!iso) return '';
  const [y, m, d] = iso.split('-');
  return `${parseInt(y)}年${parseInt(m)}月${parseInt(d)}日`;
}
function nowString() {
  const d = new Date();
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* =====================================
 * Form / Render
 * ===================================== */
function getFormData() {
  return {
    date: document.getElementById('f-date').value,
    recipient: document.getElementById('f-recipient').value,
    contacts: getContacts(),
    pages: parseInt(document.getElementById('f-pages').value) || 1,
    title: document.getElementById('f-title').value,
    body: document.getElementById('f-body').value,
    sender: document.getElementById('f-sender').value,
    fontSize: parseInt(document.getElementById('f-fontsize').value) || 11
  };
}
function setFormData(d) {
  document.getElementById('f-date').value = d.date || todayISO();
  document.getElementById('f-recipient').value = d.recipient || '';
  setContacts(normalizeContacts(d));
  document.getElementById('f-pages').value = d.pages || 1;
  document.getElementById('f-title').value = d.title || '';
  document.getElementById('f-body').value = d.body || '';
  if (d.sender !== undefined) {
    document.getElementById('f-sender').value = d.sender || '';
  }
  if (d.fontSize !== undefined) {
    document.getElementById('f-fontsize').value = String(d.fontSize);
  }
}
/* =====================================
 * 担当者（複数可）
 * ===================================== */
const HONORIFIC_OPTIONS = ['様', '御中', '先生御侍史', 'ご担当者様', 'ご担当医', '御机下'];
let contacts = [];
function honorificOptionsHtml(sel) {
  return HONORIFIC_OPTIONS.map(o => `<option value="${o}"${o === sel ? ' selected' : ''}>${o}</option>`).join('');
}
function renderContacts() {
  const cont = document.getElementById('contacts-container');
  if (!contacts.length) contacts = [{ name: '', honorific: '様' }];
  cont.innerHTML = contacts.map((ct, i) => `
    <div class="contact-row">
      <input type="text" class="contact-name" data-i="${i}" placeholder="例) 山田 太郎" value="${escapeHtml(ct.name || '')}">
      <select class="contact-honorific" data-i="${i}">${honorificOptionsHtml(ct.honorific || '様')}</select>
      <button type="button" class="contact-remove" data-i="${i}" title="この担当者を削除">✕</button>
    </div>
  `).join('');
  cont.querySelectorAll('.contact-name').forEach(el => {
    el.addEventListener('input', e => { contacts[+e.target.dataset.i].name = e.target.value; renderPreview(); });
  });
  cont.querySelectorAll('.contact-honorific').forEach(el => {
    el.addEventListener('change', e => { contacts[+e.target.dataset.i].honorific = e.target.value; renderPreview(); });
  });
  cont.querySelectorAll('.contact-remove').forEach(el => {
    el.addEventListener('click', e => removeContact(+e.target.dataset.i));
  });
}
function getContacts() {
  return contacts.map(c => ({ name: c.name || '', honorific: c.honorific || '様' }));
}
function setContacts(list) {
  contacts = (list && list.length) ? list.map(c => ({ name: c.name || '', honorific: c.honorific || '様' })) : [{ name: '', honorific: '様' }];
  renderContacts();
}
function normalizeContacts(d) {
  if (d.contacts && d.contacts.length) return d.contacts;
  if (d.person !== undefined || d.honorific !== undefined) return [{ name: d.person || '', honorific: d.honorific || '様' }];
  return [{ name: '', honorific: '様' }];
}
function addContact() {
  contacts.push({ name: '', honorific: '様' });
  renderContacts();
  renderPreview();
}
function removeContact(i) {
  if (contacts.length <= 1) contacts = [{ name: '', honorific: '様' }];
  else contacts.splice(i, 1);
  renderContacts();
  renderPreview();
}

function getDefaultSender() {
  try { return localStorage.getItem(STORAGE_KEYS.defaultSender) || ''; } catch(e) { return ''; }
}
function saveDefaultSender(name) {
  try { localStorage.setItem(STORAGE_KEYS.defaultSender, name || ''); } catch(e) {}
}

function renderPreview() {
  const d = getFormData();

  document.getElementById('p-date').textContent = formatDate(d.date) || '　';
  document.getElementById('p-pages').textContent = `送付枚数： ${d.pages} 枚（本紙含む）`;

  const recipientEl = document.getElementById('p-recipient');
  if (d.recipient) {
    recipientEl.textContent = d.recipient;
  } else {
    recipientEl.innerHTML = '<span class="empty-hint">宛先を入力してください</span>';
  }
  // 担当者（複数可）＋敬称
  const lines = (d.contacts || []).map(c => {
    const nm = (c.name || '').trim();
    const ho = c.honorific || '';
    const sa = (ho === 'ご担当者様' || ho === 'ご担当医');
    if (nm) return escapeHtml(nm) + '　' + escapeHtml(ho);
    if (sa) return escapeHtml(ho);
    return '';
  }).filter(x => x);
  document.getElementById('p-person').innerHTML = lines.join('<br>');

  const titleEl = document.getElementById('p-title');
  if (d.title) {
    titleEl.textContent = d.title;
  } else {
    titleEl.innerHTML = '<span class="empty-hint">表題を入力してください</span>';
  }

  // 送信者名（差出人ブロック内）
  const senderEl = document.getElementById('p-sender');
  if (d.sender) {
    senderEl.textContent = d.sender;
    senderEl.style.display = 'block';
  } else {
    senderEl.textContent = '';
    senderEl.style.display = 'none';
  }

  // 本文フォントサイズを適用（ページ1・2両方）
  const fontSize = d.fontSize || 11;
  const body1El = document.getElementById('p-body');
  const body2El = document.getElementById('p-body-2');
  if (body1El) body1El.style.fontSize = fontSize + 'pt';
  if (body2El) body2El.style.fontSize = fontSize + 'pt';

  // Body with auto-pagination
  paginateBody(d.body || '');

  // Save current
  saveCurrent();
}

/* Auto pagination: 本文量に応じて2枚目以降を必要なだけ自動生成（フッターと重ならない） */
function makeContPage() {
  const div = document.createElement('div');
  div.className = 'page page-cont';
  div.innerHTML = '<div class="doc-header"><div class="doc-title" style="font-size:18pt;">FAX送付状（つづき）</div></div>'
    + '<div class="body-section-label">本　文（つづき）</div>'
    + '<div class="body-block"></div>'
    + '<div class="page-footer"><span>あさぎ訪問看護リハビリステーション</span><span class="p-footer-n"></span></div>';
  return div;
}
// ページ内で本文に使える高さ（offsetTopベースなので画面縮小表示の影響を受けない）
function availableHeight(page, bodyEl) {
  const footerEl = page.querySelector('.page-footer');
  return footerEl.offsetTop - bodyEl.offsetTop - 8;
}
// bodyEl に text を収まる分だけ入れ、使った文字数を返す
function fitSplit(bodyEl, text, available) {
  bodyEl.textContent = text;
  if (bodyEl.scrollHeight <= available + 1) return text.length;
  let lo = 0, hi = text.length;
  while (lo < hi) {
    const mid = Math.floor((lo + hi + 1) / 2);
    bodyEl.textContent = text.substring(0, mid);
    if (bodyEl.scrollHeight <= available + 1) lo = mid; else hi = mid - 1;
  }
  let split = lo;
  const w = text.substring(Math.max(0, split - 80), split);
  const nl = w.lastIndexOf('\n');
  const pd = Math.max(w.lastIndexOf('。'), w.lastIndexOf('、'));
  if (nl >= 0) split = Math.max(0, split - 80) + nl + 1;
  else if (pd >= 0) split = Math.max(0, split - 80) + pd + 1;
  if (split <= 0) split = Math.max(1, lo);
  bodyEl.textContent = text.substring(0, split);
  return split;
}
function paginateBody(bodyText) {
  const cont = document.getElementById('pagesContainer');
  cont.querySelectorAll('.page-cont').forEach(p => p.remove());
  const page1 = document.getElementById('page1');
  const body1 = document.getElementById('p-body');
  const fontSize = body1.style.fontSize;
  let rest = bodyText || '';
  const used = fitSplit(body1, rest, availableHeight(page1, body1));
  rest = rest.substring(used);
  const pages = [page1];
  let guard = 0;
  while (rest.length > 0 && guard < 30) {
    guard++;
    const p = makeContPage();
    cont.appendChild(p);
    const b = p.querySelector('.body-block');
    b.style.fontSize = fontSize;
    const u = fitSplit(b, rest, availableHeight(p, b));
    if (u <= 0) break;
    rest = rest.substring(u);
    pages.push(p);
  }
  const N = pages.length;
  pages.forEach((p, i) => {
    const f = p.querySelector('.page-footer span:last-child');
    if (f) f.textContent = (i + 1) + ' / ' + N;
  });
}
// 画面幅に合わせてプレビューを縮小表示（PDF出力時は原寸に戻す）
function fitPreviewScale() {
  const area = document.querySelector('.preview-area');
  const cont = document.getElementById('pagesContainer');
  const page1 = document.getElementById('page1');
  if (!area || !cont || !page1) return;
  const avail = area.clientWidth - 32;
  const pageW = page1.offsetWidth || 794;
  const z = Math.min(1, avail / pageW);
  cont.style.zoom = String(z);
}

function deleteHistory(id) {

  history = history.filter(x => x.id !== id);
  saveHistoryStorage();
  renderHistoryList();
}

/* =====================================
 * Print / PDF
 * ===================================== */
function printDoc() {
  window.print();
}
async function downloadPDF() {
  const d = getFormData();
  const filename = `FAX送付状_${(d.recipient || '無題').replace(/[\\/:*?"<>|]/g,'')}_${(d.date||todayISO()).replace(/-/g,'')}.pdf`;

  // html2pdf.bundleが読み込まれると window.html2canvas と window.jspdf がグローバルに公開される
  const _html2canvas = window.html2canvas;
  const _jsPDF = (window.jspdf && window.jspdf.jsPDF) ? window.jspdf.jsPDF : null;

  if (!_html2canvas || !_jsPDF) {
    alert('PDFライブラリが読み込めませんでした。\nインターネット接続を確認して再読み込みするか、「印刷」ボタン→「PDFとして保存」をご利用ください。');
    return;
  }

  const btn = document.getElementById('pdfBtn');
  const prevText = btn.textContent;
  btn.textContent = '生成中...';
  btn.disabled = true;

  const cont = document.getElementById('pagesContainer');
  const pages = Array.from(cont.querySelectorAll('.page'));

  // 印刷用にbox-shadowと縮小表示を一時的に外す
  const restoreShadows = pages.map(p => p.style.boxShadow);
  pages.forEach(p => { p.style.boxShadow = 'none'; });
  const restoreZoom = cont.style.zoom;
  cont.style.zoom = '1';

  try {
    const pdf = new _jsPDF({
      unit: 'mm',
      format: 'a4',
      orientation: 'portrait',
      compress: true
    });

    const baseOpts = {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      logging: false,
      letterRendering: true,
      allowTaint: false
    };

    // レイアウト完了を待機
    await new Promise(r => setTimeout(r, 100));

    // ===== 全ページを順にキャプチャ =====
    for (let i = 0; i < pages.length; i++) {
      const pg = pages[i];
      const canvas = await _html2canvas(pg, {
        ...baseOpts,
        width: pg.offsetWidth,
        height: pg.offsetHeight,
        windowWidth: pg.offsetWidth,
        windowHeight: pg.offsetHeight
      });
      const img = canvas.toDataURL('image/jpeg', 0.95);
      if (i > 0) pdf.addPage();
      pdf.addImage(img, 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
    }

    pdf.save(filename);
  } catch (err) {
    console.error('PDF生成エラー:', err);
    alert('PDF生成中にエラーが発生しました。\n「印刷」ボタンから「PDFとして保存」をお試しください。\n\n詳細: ' + (err.message || err));
  } finally {
    pages.forEach((p, i) => { p.style.boxShadow = restoreShadows[i]; });
    cont.style.zoom = restoreZoom;
    btn.textContent = prevText;
    btn.disabled = false;
  }
}

/* =====================================
 * Toolbar feedback

let flashTimer = null;
function flashToolbar(msg) {
  const tb = document.querySelector('.toolbar strong');

  if (flashTimer) clearTimeout(flashTimer);
  flashTimer = setTimeout(() => {
    tb.textContent = orig;
    tb.style.color = '#0a6ebd';
  }, 1800);
}

/* =====================================
 * Init
 * ===================================== */
function bindEvents() {
  // 入力時のパフォーマンス改善＋iPadでの意図せぬスクロール抑制のため150msデバウンス
  let _rpTimer = null;
  const debouncedRender = () => { clearTimeout(_rpTimer); _rpTimer = setTimeout(renderPreview, 150); };
  ['f-date', 'f-recipient', 'f-pages', 'f-title', 'f-body', 'f-sender'].forEach(id => {
    document.getElementById(id).addEventListener('input', debouncedRender);
  });
  // フォントサイズはchangeイベントで反応
  document.getElementById('f-fontsize').addEventListener('change', renderPreview);
  // 送信者名は変更時に「デフォルト送信者」としても保存
  document.getElementById('f-sender').addEventListener('change', (e) => {
    saveDefaultSender(e.target.value.trim());
  });
  document.getElementById('f-sender').addEventListener('blur', (e) => {
    saveDefaultSender(e.target.value.trim());
  });
  // Close dialog on overlay click
  document.getElementById('dialog-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'dialog-overlay') closeDialog();
  });
  // Resize observer for repagination on window resize
  window.addEventListener('resize', () => {
    clearTimeout(window._renderResizeTimer);
    window._renderResizeTimer = setTimeout(() => { fitPreviewScale(); renderPreview(); }, 200);
  });
}

function init() {
  loadTemplates();
  loadHistory();
  seedTemplatesIfEmpty();

  // Set defaults
  document.getElementById('f-date').value = todayISO();

  // 保存済みデフォルト送信者を先に入れる
  const defaultSender = getDefaultSender();
  if (defaultSender) {
    document.getElementById('f-sender').value = defaultSender;
  }

  // Restore current draft（draftにsenderがあればそれが優先）
  loadCurrent();

  // 日付はドラフトに関わらず常に「アプリ起動日（=今日）」を初期値にする
  document.getElementById('f-date').value = todayISO();

  // それでも送信者欄が空 かつ 保存済みデフォルトがある場合は補完
  if (!document.getElementById('f-sender').value && defaultSender) {
    document.getElementById('f-sender').value = defaultSender;
  }

  // 担当者欄を初期化（ドラフト未保存時も1行表示）
  renderContacts();

  // Render
  bindEvents();
  renderTemplatesList();
  renderHistoryList();
  fitPreviewScale();
  renderPreview();
}

document.addEventListener('DOMContentLoaded', init);
